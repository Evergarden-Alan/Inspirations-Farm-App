# Nginx Proxy Manager includes this file inside every proxy-host server block.
# Only the media host may reach the relay; other existing hosts return 404.
location ^~ /focus-audio/ {
  if ($host != "media.alanevergarden.xyz") {
    return 404;
  }

  limit_except GET HEAD {
    deny all;
  }

  # The trailing slash strips /focus-audio/ before forwarding to the relay.
  proxy_pass http://focus-audio-relay:8787/;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header Range $http_range;
  proxy_set_header If-Range $http_if_range;
  proxy_set_header Connection "";

  proxy_buffering off;
  proxy_request_buffering off;
  proxy_max_temp_file_size 0;
  proxy_read_timeout 3600s;
  proxy_send_timeout 3600s;
}
